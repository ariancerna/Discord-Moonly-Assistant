# Default avatar URL
default_avatar: "https://i.imgur.com/Y5w3zlV.png"

sellauth:
  api_key: "SET_SELLAUTH_API_KEY"
  shop_id: "106038"

vouch:
  database_path: "data/vouches.db"
  image_directory: "data/vouch_images"
  restore_delay: 1.0  # Segundos entre cada vouch para evitar rate limits
  restore_retries: 3  # Reintentos ante errores temporales de Discord
  website_url: "https://myvouch.es/moonly"
  thumbnail: "https://i.imgur.com/p1BgaKk.png"
  footer_icon: "https://i.imgur.com/p1BgaKk.png"
  review_channel_url: "https://discord.com/channels/1159639252838129704/1159643310252638268"

# Auto-recordatorio en el canal de reseñas
reminder:
  channel_id: 1159643310252638268  # Canal donde se envía el recordatorio
  delay: 1  # Segundos de espera tras el mensaje del usuario
  ticket_channel_id: 1159646450704203821  # Canal de tickets (0 = usa el texto de abajo)
  ticket_channel_text: "**#🎫・tickets**"
  vouch_command: "</vouch:1403090399777784010>"
  website_url: "https://moonlygg.com"
  button_label: "Nuestra Página Web"
  button_emoji: "<:PandaDab:1234344971264331836>"
  thumbnail: "https://i.imgur.com/p1BgaKk.png"
  footer_text: "Moonly Manager - Mensajes Fijados"
  footer_icon: "https://i.imgur.com/p1BgaKk.png"

# Protección contra campañas de spam con imágenes
antispam:
  enabled: true
  alert_channel_id: 1207453755885494352
  database_path: "data/antispam.db"
  delete_threshold: 70
  timeout_threshold: 70  # Igual al umbral de eliminación: siempre aplica timeout
  timeout_minutes: 10080  # 7 días
  window_seconds: 45
  campaign_window_seconds: 300
  visual_distance: 8
  maximum_image_bytes: 10485760
  maximum_image_pixels: 40000000
  analysis_concurrency: 4
  exempt_channel_ids: []
  exempt_role_ids: []

# Traducciones gratuitas de las publicaciones creadas con /crear-embed
translation:
  provider: "deep-translator"
  database_path: "data/embed_translations.db"
