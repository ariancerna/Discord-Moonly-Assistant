    type: "playing"  # playing, watching, listening, streaming, competing
    name: "Moonlygg.com"
    url: null  # Only for streaming
  embed_color: 0x6c02ff  # Default embed color (hex)

# Server Configuration
roles:
  client_role: 1159639724407935098  # Role ID for clients
  vouch_manager_role: 1159641262077509642  # Puede restaurar y eliminar vouches
  moderator_role: 1236091726301761567  # Moderator role ID
  support_role: 1219803282223009962 # Support role ID
  admin_role: 1162039017248923728  # Admin role ID

# Category IDs (allowed for moving channels)
