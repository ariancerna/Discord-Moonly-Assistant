Criptomonedas:
  title: ""
  description: |
    ## 🔐 **__Pago con Criptomonedas__**
    
    > Realiza tu pago de forma segura y descentralizada utilizando criptomonedas. Aceptamos LTC, BTC y USDT. Este método ofrece privacidad y rapidez en las transacciones.
    
    **📝 Instrucciones de Pago**
    > 1. Abre tu **wallet de criptomonedas** (Binance, Trust Wallet, Coinbase, etc.).
    > 2. Selecciona la criptomoneda que deseas usar (LTC, BTC o USDT).
    > 3. Copia la dirección de wallet correspondiente proporcionada abajo.
    > 4. **Verifica que la red sea correcta** (especialmente para USDT).
    > 5. Envía el monto acordado.
    > 6. Toma una captura de pantalla del comprobante de transacción.
    
    **💎 Wallets Disponibles**
    
    **Litecoin (LTC):**
    ```Li43p3wMFfpJwEiunrAyBe1Z1gckGBQJMf```
    
    **Bitcoin (BTC):**
    ```1BVXFnn9F6jMbRt4iuxUqia1a6GwsuaYJG```
    
    **USDT (Tether):**
    ```0x34d95a3093e8256500263fd688f8c2e0c979b3e0```
    **Red:** BEP20 (Binance Smart Chain)
    
    **📸 Envío del Comprobante**
    > Una vez realizado el pago, envíanos la captura de pantalla del comprobante que muestre:
    > - Hash de la transacción (TxID)
    > - Monto enviado
    > - Criptomoneda utilizada
    > - Fecha y hora de la transacción
    
    **⚠️ ¡Importante - Verificación de Red!**
    > - Para **USDT**, asegúrate de usar la red **BEP20 (BSC)**. Usar otra red resultará en pérdida de fondos.
    > - **Verifica dos veces** la dirección de wallet antes de enviar.
    > - Las transacciones de criptomonedas son **irreversibles**.
    > - Espera las confirmaciones necesarias de la red antes de notificarnos.
