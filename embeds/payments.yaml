GiftCards:
  title: ""
  description: |
    ## 🎁 **__Pago con Gift Cards__**
    
    > Realiza tu pago utilizando tarjetas de regalo digitales. Aceptamos Binance Gift Cards y PSN Cards. Este método es ideal si prefieres no usar métodos bancarios tradicionales.
    
    **📝 Instrucciones de Pago**
    > 1. Compra la gift card en uno de los **proveedores autorizados** listados abajo.
    > 2. **Verifica que la región sea correcta** (Global o Perú).
    > 3. Una vez recibida, envía el **código de la gift card** al privado del dueño.
    > 4. Adjunta el **comprobante de compra** con fecha y monto.
    
    **🎮 Binance Gift Card**
    
    > **Proveedores Autorizados:**
    > 
    > **Eneba (Principal):**
    > [Comprar Binance Gift Card en Eneba](https://www.eneba.com/latam/store/binance-gift-cards)
    > 
    > **G2A (Alternativo):**
    > [Comprar Binance Gift Card en G2A](https://www.g2a.com/es/best-deals/binance-gift-cards)
    
    **🎮 PSN Cards (PlayStation Network)**
    
    > **Proveedor Autorizado:**
    > 
    > **Games Center Perú:**
    > [Comprar PSN Cards en Games Center](https://gamescenter.pe/categoria-producto/psn-cards-playstation/)
    
    **📨 Envío del Código y Comprobante**
    > **Envía el código de la gift card al privado del dueño:**
    > <@1412060465105862706> (juztswift)
    > 
    > Debes incluir:
    > - Código completo de la gift card
    > - Captura del comprobante de compra
    > - Región de la tarjeta (debe ser Global o Perú)
    
    **⚠️ ¡Importante - Región de las Tarjetas!**
    > - Las gift cards **DEBEN ser Globales o para Perú**.
    > - **NO compres** tarjetas de otras regiones (USA, Europa, etc.) si no especifican que son globales.
    > - Tarjetas de región incorrecta **NO pueden ser canjeadas en Perú** y resultarán en pérdida de dinero.
    > - **Verifica la región ANTES de comprar** para evitar problemas.
    > - Si tienes dudas sobre la región, pregunta antes de realizar la compra.
    > - **NUNCA compartas el código de la gift card públicamente**, solo envíalo por privado al dueño.
