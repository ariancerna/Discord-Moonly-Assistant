PayPal:
  title: ""
  description: |
    ## 💳 **__Pago con PayPal__**
    
    > Realiza tu pago de forma segura y rápida a través de PayPal. Asegúrate de seguir las instrucciones cuidadosamente para evitar retrasos en tu pedido.
    
    **📝 Instrucciones de Pago**
    > 1. Haz clic en el enlace de PayPal proporcionado abajo.
    > 2. **Selecciona la opción de cubrir comisiones** (Este paso es fundamental).
    > 3. Completa el pago según el monto acordado.
    > 4. Toma una captura de pantalla del comprobante.
    
    **📸 Requisitos del Comprobante**
    > La captura debe mostrar claramente:
    > - ⏰ Hora y fecha de la transacción
    > - 💵 Monto enviado
    > - ✅ Estado de la transacción completada
    
    **🔗 Enlace de Pago**
    > [Haz clic aquí para pagar con PayPal](https://links.moonlygg.com/paypal-snifex)
    
    **⚠️ ¡Importante!**
    > Si no seleccionas la opción de cubrir comisiones, el proceso no podrá continuar y tu pedido se retrasará.
