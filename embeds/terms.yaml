  description: |
    # __Información importante__
    
    Te presentamos nuestros términos y condiciones. Léelos atentamente. Al realizar el pago, **aceptas automáticamente estos términos**, y **nos reservamos el derecho total de hacerlos cumplir**.
    
    1. La cuenta debe estar **sin reportes ni historial negativo** en Rockstar. Asimismo, **no debe haberse usado mods o scripts** en la cuenta.
    2. La entrega del cheteo puede **demorar dependiendo de la demanda** o si es fin de semana. Nuestro equipo se comunicará contigo al momento de realizar el cheteo, por lo cual **te pedimos paciencia**.
    3. Al realizar un cheteo, **existe un riesgo**, ya que estos procesos afectan directamente a Rockstar. Por ello, te recomendamos seguir estas indicaciones:
      - No usar cuentas principales si deseas conservar tu progreso.
      - No exceder los gastos diarios a más de 50 Millones.
      - Al hacer un cheteo, siempre existirá el riesgo de que la cuenta sea baneada durante o después del proceso, y no podemos hacer nada al respecto.
    # __Garantía del producto__
    
    1. Ofrecemos una garantía opcional de **7 USD**, la cual permite reponer todo el dinero agregado previamente en la cuenta, ya que el proceso del cheteo es extenso y te lo ofrecemos a un precio muy accesible.
    2. No realizamos reembolsos ni aceptamos disputas. Nuestros términos están diseñados para respaldarnos legalmente frente a cualquier reclamación.
